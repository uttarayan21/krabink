# XcodeGen spec for the iPad app. Generate the project with:
#   nix run nixpkgs#xcodegen   (in this directory)
# Requires ios/KrabinkCore to be built first (scripts/build-ios-core.sh).
name: Krabink
options:
  bundleIdPrefix: dev.darksailor
  deploymentTarget:
    iOS: "17.0"
packages:
  KrabinkCore:
    path: ../KrabinkCore
targets:
  Krabink:
    type: application
    platform: iOS
    sources:
      - Sources
      # App icon (1024 PNG, rendered by scripts/gen-app-icon.py).
      - Assets.xcassets
      # Privacy manifest: required-reason APIs, no tracking, no collection.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      # The brush corpus, copied as a folder so the brush lab can replay
      # the same recordings the core tests measure.
      - path: ../../crates/krabink-core/tests/corpus/brush
        type: folder
        buildPhase: resources
    dependencies:
      - package: KrabinkCore
    # Explicit Info.plist (instead of GENERATE_INFOPLIST_FILE) because the
    # pairing QR flow registers the krabink:// URL scheme, which has no
    # INFOPLIST_KEY_ build setting. With an explicit plist Xcode does NOT
    # merge INFOPLIST_KEY_ settings, so everything must be listed here.
    # Without UILaunchScreen iPadOS runs the app letterboxed in a scaled
    # compatibility mode.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Krabink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # No ITSAppUsesNonExemptEncryption on purpose: iroh ships its own
        # TLS (rustls/ring) rather than the OS stack, so the honest value
        # is true, but ASC rejects true without an
        # ITSEncryptionExportComplianceCode (ITMS-90592). Leaving the key
        # out makes ASC ask the export-compliance questions per build
        # instead; once it issues a code, set both keys here.
        # See docs/release-ios.md.
        UILaunchScreen: {}
        # Documents visible in Files, for `-recordStrokes 1` recordings.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.darksailor.krabink.pair
            CFBundleURLSchemes: [krabink]
        # "Open in Krabink" for markdown files (Files, share sheet, AirDrop):
        # the file is imported as a new note to annotate with the Pencil.
        # Viewer, not Editor: the note is a copy, the file is left as is.
        # Alternate rank so a dedicated markdown editor stays the default.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
        # iOS does not declare the markdown type itself; importing it makes
        # .md/.markdown files resolve to it (a system or app declaration
        # wins if one exists).
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]
        NSCameraUsageDescription: >-
          Krabink uses the camera to scan another device's pairing QR code.
        NSLocalNetworkUsageDescription: >-
          Krabink looks for your paired desktop on the local network to sync
          directly with it.
        NSBonjourServices: [_krabink._udp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.darksailor.krabink
        # Store version. Bump with the workspace version in Cargo.toml.
        # The build number (CFBundleVersion) is the commit count;
        # scripts/archive-ios.sh overrides CURRENT_PROJECT_VERSION.
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad-first, but runs on iPhone too for cheap simulator checks.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          # Store builds are iPad-only: the split-view layout is designed
          # for iPad and shipping iPhone would need its own screenshots
          # and review pass.
          TARGETED_DEVICE_FAMILY: "2"
          # dSYMs travel with the archive (uploadSymbols) so App Store
          # Connect can symbolicate crash reports.
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  KrabinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Krabink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
