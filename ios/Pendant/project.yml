# XcodeGen spec for the iPad app. Generate the project with:
#   nix run nixpkgs#xcodegen   (in this directory)
# Requires ios/PendantCore to be built first (scripts/build-ios-core.sh).
name: Pendant
options:
  bundleIdPrefix: dev.darksailor
  deploymentTarget:
    iOS: "17.0"
packages:
  PendantCore:
    path: ../PendantCore
targets:
  Pendant:
    type: application
    platform: iOS
    sources:
      - Sources
      # The brush corpus, copied as a folder so the brush lab can replay
      # the same recordings the core tests measure.
      - path: ../../crates/pendant-core/tests/corpus/brush
        type: folder
        buildPhase: resources
    dependencies:
      - package: PendantCore
    # Explicit Info.plist (instead of GENERATE_INFOPLIST_FILE) because the
    # pairing QR flow registers the pendant:// URL scheme, which has no
    # INFOPLIST_KEY_ build setting. With an explicit plist Xcode does NOT
    # merge INFOPLIST_KEY_ settings, so everything must be listed here.
    # Without UILaunchScreen iPadOS runs the app letterboxed in a scaled
    # compatibility mode.
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        # Documents visible in Files, for `-recordStrokes 1` recordings.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.darksailor.pendant.pair
            CFBundleURLSchemes: [pendant]
        NSCameraUsageDescription: >-
          Pendant uses the camera to scan another device's pairing QR code.
        NSLocalNetworkUsageDescription: >-
          Pendant looks for your paired desktop on the local network to sync
          directly with it.
        NSBonjourServices: [_pendant._udp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.darksailor.pendant
        # iPad-first, but runs on iPhone too for cheap simulator checks.
        TARGETED_DEVICE_FAMILY: "1,2"
  PendantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Pendant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
