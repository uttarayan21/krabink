# XcodeGen spec for the iPad app. Generate the project with:
#   nix run nixpkgs#xcodegen   (in this directory)
# Requires ios/PendantCore to be built first (scripts/build-ios-core.sh).
name: Pendant
options:
  bundleIdPrefix: dev.darksailor
  deploymentTarget:
    iOS: "17.0"
packages:
  PendantCore:
    path: ../PendantCore
targets:
  Pendant:
    type: application
    platform: iOS
    sources:
      - Sources
      # App icon (1024 PNG, rendered by scripts/gen-app-icon.py).
      - Assets.xcassets
      # Privacy manifest: required-reason APIs, no tracking, no collection.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      # The brush corpus, copied as a folder so the brush lab can replay
      # the same recordings the core tests measure.
      - path: ../../crates/pendant-core/tests/corpus/brush
        type: folder
        buildPhase: resources
    dependencies:
      - package: PendantCore
    # Explicit Info.plist (instead of GENERATE_INFOPLIST_FILE) because the
    # pairing QR flow registers the pendant:// URL scheme, which has no
    # INFOPLIST_KEY_ build setting. With an explicit plist Xcode does NOT
    # merge INFOPLIST_KEY_ settings, so everything must be listed here.
    # Without UILaunchScreen iPadOS runs the app letterboxed in a scaled
    # compatibility mode.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pendant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # iroh ships its own TLS (rustls/ring) rather than using the OS
        # stack, which Apple does not treat as exempt: App Store Connect
        # asks the export-compliance questions on the first upload and
        # hands back an ITSEncryptionExportComplianceCode to add here.
        # See docs/release-ios.md.
        ITSAppUsesNonExemptEncryption: true
        UILaunchScreen: {}
        # Documents visible in Files, for `-recordStrokes 1` recordings.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.darksailor.pendant.pair
            CFBundleURLSchemes: [pendant]
        NSCameraUsageDescription: >-
          Pendant uses the camera to scan another device's pairing QR code.
        NSLocalNetworkUsageDescription: >-
          Pendant looks for your paired desktop on the local network to sync
          directly with it.
        NSBonjourServices: [_pendant._udp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.darksailor.pendant
        # Store version. Bump with the workspace version in Cargo.toml.
        # The build number (CFBundleVersion) is the commit count;
        # scripts/archive-ios.sh overrides CURRENT_PROJECT_VERSION.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad-first, but runs on iPhone too for cheap simulator checks.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          # Store builds are iPad-only: the split-view layout is designed
          # for iPad and shipping iPhone would need its own screenshots
          # and review pass.
          TARGETED_DEVICE_FAMILY: "2"
          # dSYMs travel with the archive (uploadSymbols) so App Store
          # Connect can symbolicate crash reports.
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  PendantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Pendant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
