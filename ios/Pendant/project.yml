# XcodeGen spec for the iPad app. Generate the project with:
#   nix run nixpkgs#xcodegen   (in this directory)
# Requires ios/PendantCore to be built first (scripts/build-ios-core.sh).
name: Pendant
options:
  bundleIdPrefix: dev.darksailor
  deploymentTarget:
    iOS: "17.0"
packages:
  PendantCore:
    path: ../PendantCore
targets:
  Pendant:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: PendantCore
    # Explicit Info.plist (instead of GENERATE_INFOPLIST_FILE) because the
    # pairing QR flow registers the pendant:// URL scheme, which has no
    # INFOPLIST_KEY_ build setting. Xcode still merges the INFOPLIST_KEY_
    # settings below into the final plist.
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.darksailor.pendant.pair
            CFBundleURLSchemes: [pendant]
        NSCameraUsageDescription: >-
          Pendant uses the camera to scan another device's pairing QR code.
        NSLocalNetworkUsageDescription: >-
          Pendant looks for your paired desktop on the local network to sync
          directly with it.
        NSBonjourServices: [_pendant._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.darksailor.pendant
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPad-first, but runs on iPhone too for cheap simulator checks.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  PendantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Pendant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
