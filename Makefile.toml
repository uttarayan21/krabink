# cargo-make entry points (`cargo make <task>`, or `makers <task>`).
# cargo-make is in the flake devShell. The Apple, release and icon tasks
# are `cargo xtask` subcommands (xtask/); `cargo xtask --help` lists them
# with their options, and started on Linux they hand themselves to the Mac
# build machine. Arguments after the task name are forwarded as-is, with
# no `--` separator: `cargo make run --data-dir /tmp/b`.

[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
alias = "check"

# --- Rust -----------------------------------------------------------------

[tasks.run]
description = "Run the desktop app (release build)"
command = "cargo"
args = ["xtask", "run", "${@}"]

[tasks.server]
description = "Run the relay + replica in dev mode"
command = "cargo"
args = ["run", "-p", "krabink-server", "--", "--dev", "${@}"]

[tasks.build]
description = "Build the workspace"
command = "cargo"
args = ["build", "--workspace", "${@}"]

[tasks.test]
description = "Run the workspace tests"
command = "cargo"
args = ["test", "--workspace", "${@}"]

[tasks.clippy]
description = "Clippy with warnings denied, as in CI"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.fmt]
description = "Format Rust and TOML sources"
script = ["cargo fmt --all", "taplo fmt"]

[tasks.fmt-check]
description = "Check Rust and TOML formatting"
script = ["cargo fmt --all -- --check", "taplo fmt --check"]

[tasks.deny]
description = "Audit dependency licenses and advisories"
command = "cargo"
args = ["deny", "check"]

[tasks.check]
description = "fmt-check, clippy and test"
dependencies = ["fmt-check", "clippy", "test"]

[tasks.flake-check]
description = "Every CI check through nix"
command = "nix"
args = ["flake", "check", "-L"]

# --- Release --------------------------------------------------------------

[tasks.bump]
description = "Bump the app version: cargo make bump major|minor|patch"
command = "cargo"
args = ["xtask", "bump", "${@}"]

[tasks.release]
description = "Upload the tagged version to App Store Connect: cargo make release [--ios|--macos] [--tag] [--export] [--clean]"
command = "cargo"
args = ["xtask", "release", "${@}"]

# --- iPad -----------------------------------------------------------------

[tasks.build-ios-core]
description = "Build the KrabinkCore XCFramework and Swift bindings"
command = "cargo"
args = ["xtask", "build-ios-core"]

[tasks.swift-smoke]
description = "Compile and run the Swift bindings smoke test"
command = "cargo"
args = ["xtask", "swift-smoke"]

[tasks.gen-xcodeproj]
description = "Regenerate Krabink.xcodeproj from project.yml"
command = "cargo"
args = ["xtask", "gen-xcodeproj"]

[tasks.check-ipad]
description = "Compile the iPad app for the simulator"
command = "cargo"
args = ["xtask", "check-ipad", "${@}"]

[tasks.run-ipad]
description = "Build, install and launch on a connected iPad"
command = "cargo"
args = ["xtask", "run-ipad", "${@}"]

[tasks.archive-ios]
description = "Archive and export the iPad app for App Store Connect"
command = "cargo"
args = ["xtask", "archive-ios", "${@}"]

[tasks.upload-ios]
description = "Archive the iPad app and upload it to App Store Connect"
command = "cargo"
args = ["xtask", "archive-ios", "--destination", "upload", "${@}"]

# --- macOS ----------------------------------------------------------------

[tasks.archive-macos]
description = "Archive and export the Mac App Store .pkg"
command = "cargo"
args = ["xtask", "archive-macos", "${@}"]

[tasks.upload-macos]
description = "Archive the Mac app and upload it to App Store Connect"
command = "cargo"
args = ["xtask", "archive-macos", "--destination", "upload", "${@}"]

# --- Icons ----------------------------------------------------------------

[tasks.gen-app-icon]
description = "Render the 1024px App Store icon"
command = "cargo"
args = ["xtask", "gen-app-icon", "${@}"]

[tasks.gen-mac-icon]
description = "Render the Mac icon set from the iPad icon"
command = "cargo"
args = ["xtask", "gen-mac-icon"]
