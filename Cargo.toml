[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ink-stroke-modeler-rs = "0.1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
error-stack = "0.8"
thiserror = "2.0"
tokio = { version = "1.43", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "net",
  "time",
  "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
ulid = { version = "1", features = ["serde"] }
loro = "1.13"
redb = "4.2"
futures = "0.3"
toml = "0.9"
bevy_egui = "0.42"
egui_commonmark = "0.25"
directories = "6"
proptest = "1"
tempfile = "3"
uniffi = "0.32"
lyon_tessellation = "1.0"
pendant-core = { path = "crates/pendant-core" }
pendant-server = { path = "crates/pendant-server" }
pendant-local = { path = "crates/pendant-local" }
iroh = "1.2"
iroh-relay = "1.2"
if-addrs = "0.15"
mdns-sd = "0.21"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
rustls-pki-types = { version = "1", features = ["std"] }

# Keep heavy deps (bevy, loro) optimised even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
