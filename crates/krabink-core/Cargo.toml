[package]
name = "krabink-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Document model, CRDT wrapper, sync protocol and storage for krabink"

[features]
# The ink-stroke-modeler input model trial (P4); off by default.
ism = ["dep:ink-stroke-modeler-rs"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
postcard.workspace = true
ulid.workspace = true
tracing.workspace = true
loro.workspace = true
pulldown-cmark.workspace = true
lyon_tessellation.workspace = true
ink-stroke-modeler-rs = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb.workspace = true

# ulid pulls getrandom 0.3 through rand; the browser needs its JS backend.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
