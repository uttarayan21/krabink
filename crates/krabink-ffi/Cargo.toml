[package]
name = "krabink-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI bindings surface exposing krabink-core to Swift"

[lib]
name = "krabink_ffi"
# staticlib for the iOS XCFramework, cdylib for macOS smoke tests and
# library-mode bindgen, plain lib for Rust unit/integration tests.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Pulls in the uniffi CLI for the bindgen bin; keep it off for iOS lib builds.
bindgen = ["uniffi/cli"]
# The ink-stroke-modeler input model trial; the iOS build turns it on.
ism = ["krabink-core/ism"]

[dependencies]
krabink-core.workspace = true
krabink-local.workspace = true
uniffi.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
krabink-server.workspace = true
iroh.workspace = true
tempfile.workspace = true
