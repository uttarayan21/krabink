[package]
name = "krabink"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop client for krabink: markdown notes with live-synced page ink"

# The bin links all of bevy; running it as a test harness SIGSEGVs under
# nextest's --list and it contains no tests - logic lives in krabink-core.
[[bin]]
name = "krabink"
path = "src/main.rs"
test = false

[features]
# Dev-only fast linking: `cargo run -p krabink --features dev`.
# Never enable for release/Nix builds - it links against libbevy_dylib.
dev = ["bevy/dynamic_linking"]
# The ink-stroke-modeler input model row in `krabink brush-lab`.
ism = ["krabink-core/ism"]

[dependencies]
krabink-core.workspace = true
krabink-local.workspace = true
iroh.workspace = true
error-stack.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Default features cover every target: wayland/x11 natively, WebGL2 in the
# browser (the ink shader avoids storage buffers so Firefox/Linux work).
bevy = "0.19"
bevy_egui.workspace = true
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
tokio.workspace = true
n0-future.workspace = true
toml.workspace = true
ulid.workspace = true
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
krabink-local = { workspace = true, features = ["mdns"] }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "net",
  "time",
  "signal",
] }
clap.workspace = true
clap_complete.workspace = true
directories.workspace = true
gethostname = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
krabink-idb = { path = "../krabink-idb" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Document",
  "History",
  "Location",
  "Navigator",
  "StorageManager",
  "Window",
] }
console_error_panic_hook = "0.1"

[dev-dependencies]
tempfile.workspace = true
